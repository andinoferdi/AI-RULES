[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rules"
version = "0.1.0"
description = "Andino Skills: installer for evidence-first skills for AI coding agents"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["questionary>=2.1,<3", "rich>=13.9,<15"]

[project.optional-dependencies]
build = ["pyinstaller>=6.9"]

[project.scripts]
ai-rules = "ai_rules.cli:main"
andino = "ai_rules.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_rules = ["catalog/data/*.json", "profiles/data/*.json", "release/data/*.json", "release/data/bundles/**/*"]
