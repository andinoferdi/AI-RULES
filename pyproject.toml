[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rules"
version = "0.1.0"
description = "AI-RULES installer/orchestrator control plane"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["questionary>=2.1,<3"]

[project.optional-dependencies]
build = ["pyinstaller>=6.9"]

[project.scripts]
ai-rules = "ai_rules.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_rules = ["catalog/data/*.json", "profiles/data/*.json", "release/data/*.json"]
