name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check configuration
        env:
          PAYLANE_PUBLISHABLE_KEY: ${{ vars.PAYLANE_PUBLISHABLE_KEY }}
          PAYLANE_SECRET_KEY: ${{ secrets.PAYLANE_SECRET_KEY }}
          PAYLANE_WEBHOOK_SECRET: ${{ secrets.PAYLANE_WEBHOOK_SECRET }}
          MAILBIRD_API_TOKEN: ${{ secrets.MAILBIRD_API_TOKEN }}
          MAILBIRD_SENDER: orders@kedai.example
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
        run: python scripts/check_config.py --env-only
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "deploy-${GITHUB_SHA::7}" --notes "Deployed ${GITHUB_SHA}"
