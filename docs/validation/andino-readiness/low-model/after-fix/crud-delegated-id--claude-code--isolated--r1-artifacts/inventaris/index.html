<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventaris Barang</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #1f2328;
      background: #f6f7f9;
      accent-color: #0b5cad;
    }
    body { margin: 0; }
    main { max-width: 760px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 20px; }
    .panel { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; overflow-x: auto; }
    form { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding: 16px; }
    label { display: flex; flex: 1 1 200px; flex-direction: column; gap: 4px; font-size: 0.875rem; }
    input { font: inherit; padding: 8px 10px; border: 1px solid #8c959f; border-radius: 6px; }
    button {
      font: inherit;
      padding: 8px 14px;
      border: 1px solid #8c959f;
      border-radius: 6px;
      background: #fff;
      color: #1f2328;
      cursor: pointer;
    }
    button:hover { background: #f0f3f6; }
    button.utama { background: #0b5cad; border-color: #0b5cad; color: #fff; }
    button.utama:hover { background: #094a8c; }
    button.hapus { color: #b42318; }
    input:focus-visible, button:focus-visible { outline: 2px solid #0b5cad; outline-offset: 2px; }
    #pesan { min-height: 1.5em; margin: 12px 0; }
    #pesan.error { color: #b42318; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #d8dee4; text-align: left; }
    th { font-size: 0.875rem; color: #57606a; }
    th.angka, td.angka { text-align: right; font-variant-numeric: tabular-nums; }
    td.kosong { color: #57606a; text-align: center; padding: 24px; }
    td button + button { margin-left: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>Inventaris Barang</h1>

    <section class="panel">
      <form id="form-barang">
        <label>
          Nama barang
          <input id="nama" name="nama" maxlength="100" required>
        </label>
        <label>
          Jumlah
          <input id="jumlah" name="jumlah" type="number" min="0" step="1" required>
        </label>
        <button id="simpan" class="utama" type="submit">Tambah</button>
        <button id="batal" type="button" hidden>Batal</button>
      </form>
    </section>

    <p id="pesan" role="status"></p>

    <section class="panel">
      <table>
        <thead>
          <tr><th>Nama barang</th><th class="angka">Jumlah</th><th>Aksi</th></tr>
        </thead>
        <tbody id="daftar"></tbody>
      </table>
    </section>
  </main>

  <script>
    const form = document.getElementById("form-barang");
    const namaInput = document.getElementById("nama");
    const jumlahInput = document.getElementById("jumlah");
    const simpanBtn = document.getElementById("simpan");
    const batalBtn = document.getElementById("batal");
    const pesan = document.getElementById("pesan");
    const daftar = document.getElementById("daftar");
    let editingId = null;

    async function request(method, url, body) {
      const options = { method, headers: {} };
      if (body !== undefined) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(body);
      }
      let response;
      try {
        response = await fetch(url, options);
      } catch {
        throw new Error("Tidak dapat terhubung ke server.");
      }
      if (response.status === 204) return null;
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Terjadi kesalahan.");
      return data;
    }

    function tampilkan(teks, isError = false) {
      pesan.textContent = teks;
      pesan.className = isError ? "error" : "";
    }

    function tombol(label, onClick, kelas = "") {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = label;
      if (kelas) btn.className = kelas;
      btn.addEventListener("click", onClick);
      return btn;
    }

    function buatBaris(item) {
      const tr = document.createElement("tr");
      const nama = document.createElement("td");
      nama.textContent = item.nama;
      const jumlah = document.createElement("td");
      jumlah.className = "angka";
      jumlah.textContent = item.jumlah;
      const aksi = document.createElement("td");
      aksi.append(
        tombol("Ubah", () => mulaiUbah(item)),
        tombol("Hapus", () => hapusBarang(item), "hapus")
      );
      tr.append(nama, jumlah, aksi);
      return tr;
    }

    function buatKosong() {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 3;
      td.className = "kosong";
      td.textContent = "Belum ada barang. Isi form di atas untuk menambah barang pertama.";
      tr.append(td);
      return tr;
    }

    async function muatDaftar() {
      const items = await request("GET", "/api/items");
      daftar.replaceChildren(...(items.length > 0 ? items.map(buatBaris) : [buatKosong()]));
    }

    function resetForm() {
      editingId = null;
      form.reset();
      simpanBtn.textContent = "Tambah";
      batalBtn.hidden = true;
    }

    function mulaiUbah(item) {
      editingId = item.id;
      namaInput.value = item.nama;
      jumlahInput.value = item.jumlah;
      simpanBtn.textContent = "Simpan perubahan";
      batalBtn.hidden = false;
      tampilkan("");
      namaInput.focus();
    }

    async function hapusBarang(item) {
      if (!confirm(`Hapus "${item.nama}" dari inventaris?`)) return;
      try {
        await request("DELETE", `/api/items/${item.id}`);
        if (editingId === item.id) resetForm();
        tampilkan("Barang dihapus.");
        await muatDaftar();
      } catch (error) {
        tampilkan(error.message, true);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = { nama: namaInput.value, jumlah: Number(jumlahInput.value) };
      try {
        if (editingId === null) {
          await request("POST", "/api/items", data);
          tampilkan("Barang ditambahkan.");
        } else {
          await request("PUT", `/api/items/${editingId}`, data);
          tampilkan("Barang diubah.");
        }
        resetForm();
        await muatDaftar();
      } catch (error) {
        tampilkan(error.message, true);
      }
    });

    batalBtn.addEventListener("click", () => {
      resetForm();
      tampilkan("");
    });

    muatDaftar().catch((error) => tampilkan(error.message, true));
  </script>
</body>
</html>
