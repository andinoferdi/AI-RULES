<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar Buku</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Daftar Buku</h1>

    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Tambah buku</h2>
      <form id="book-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="title">Judul</label>
            <input id="title" name="title" type="text" maxlength="200" required aria-describedby="title-error">
            <p id="title-error" class="field-error"></p>
          </div>
          <div class="field">
            <label for="author">Penulis</label>
            <input id="author" name="author" type="text" maxlength="100" required aria-describedby="author-error">
            <p id="author-error" class="field-error"></p>
          </div>
          <div class="field">
            <label for="year">Tahun</label>
            <input id="year" name="year" type="number" min="1000" required aria-describedby="year-error">
            <p id="year-error" class="field-error"></p>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" id="submit-button" class="primary">Tambah buku</button>
          <button type="button" id="cancel-button" class="secondary" hidden>Batal</button>
        </div>
      </form>
      <p id="status" class="status" role="status"></p>
    </section>

    <section aria-labelledby="list-title">
      <h2 id="list-title">Daftar buku</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Judul</th>
              <th scope="col">Penulis</th>
              <th scope="col">Tahun</th>
              <th scope="col"><span class="visually-hidden">Aksi</span></th>
            </tr>
          </thead>
          <tbody id="book-rows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
