<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daftar Buku</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Daftar Buku</h1>
    </header>

    <main class="layout">
      <section class="panel" aria-labelledby="form-title">
        <h2 id="form-title">Tambah buku</h2>
        <form id="book-form" novalidate>
          <input type="hidden" id="book-id" />

          <div class="field">
            <label for="title">Judul</label>
            <input id="title" name="title" type="text" maxlength="200" aria-describedby="title-error" />
            <p class="field-error" id="title-error"></p>
          </div>

          <div class="field">
            <label for="author">Penulis</label>
            <input id="author" name="author" type="text" maxlength="100" aria-describedby="author-error" />
            <p class="field-error" id="author-error"></p>
          </div>

          <div class="field">
            <label for="year">Tahun terbit</label>
            <input id="year" name="year" type="number" step="1" min="1000" aria-describedby="year-error" />
            <p class="field-error" id="year-error"></p>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submit-button">Simpan buku</button>
            <button type="button" class="btn" id="cancel-button" hidden>Batal</button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="list-title">
        <div class="list-header">
          <h2 id="list-title">Daftar buku</h2>
          <span id="count" class="muted"></span>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Judul</th>
                <th scope="col">Penulis</th>
                <th scope="col" class="num">Tahun</th>
                <th scope="col"><span class="visually-hidden">Aksi</span></th>
              </tr>
            </thead>
            <tbody id="book-rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
