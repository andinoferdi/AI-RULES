name: Build AI-RULES releases

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: ai-rules-windows-x64.exe
          - os: macos-latest
            asset: ai-rules-macos-x64
          - os: ubuntu-latest
            asset: ai-rules-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --editable ".[build]"
      - name: Build standalone artifact
        run: python scripts/build_release.py --output release --asset-name "${{ matrix.asset }}"
      - name: Smoke executable
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then ./release/ai-rules.exe --help; else ./release/ai-rules --help; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/
