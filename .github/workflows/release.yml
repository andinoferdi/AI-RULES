name: Build AI-RULES releases

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/validate-skills.yml

  build:
    needs: quality
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: ai-rules-windows-x64.exe
          - os: macos-latest
            asset: ai-rules-macos-arm64
          - os: ubuntu-latest
            asset: ai-rules-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --editable ".[build]"
      - name: Build standalone artifact
        run: python scripts/build_release.py --output release --asset-name "${{ matrix.asset }}"
      - name: Smoke executable
        shell: bash
        run: |
          ./release/${{ matrix.asset }} --help
      - name: Verify bundled installation and every resource without Git
        run: python scripts/smoke_release.py --executable "release/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-input
          merge-multiple: true
      - name: Aggregate checksums
        shell: bash
        run: |
          mkdir release
          cp release-input/ai-rules-windows-x64.exe release-input/ai-rules-macos-arm64 release-input/ai-rules-linux-x64 release/
          cd release
          sha256sum ai-rules* > SHA256SUMS
          python -c 'import hashlib,json,pathlib; p=pathlib.Path("."); a=[{"name":x.name,"sha256":hashlib.sha256(x.read_bytes()).hexdigest(),"size":x.stat().st_size} for x in sorted(p.glob("ai-rules*"))]; pathlib.Path("release-manifest.json").write_text(json.dumps({"schema_version":1,"artifacts":a},indent=2)+"\n")'
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
