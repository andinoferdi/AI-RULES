name: Validate skills
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  changes:
    name: Decide which checks run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      installer: ${{ steps.diff.outputs.installer }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # Schedule, manual dispatch and release calls always run everything.
          if [ "$EVENT" != pull_request ] && [ "$EVENT" != push ]; then
            echo installer=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo installer=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qE '^(src/|tests/installer/|pyproject\.toml|packaging/|scripts/(build_release|smoke_release|ci_checks)\.py|\.github/workflows/)'; then
            echo installer=true >> "$GITHUB_OUTPUT"
          else
            echo installer=false >> "$GITHUB_OUTPUT"
          fi

  skills:
    name: Skills and validators
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fetch the WebBased commit used by the Focus reference check
        run: git fetch --no-tags origin WebBased
      - name: Install AI-RULES package
        run: python3 -m pip install --editable .
      - name: Run skill checks against skills/
        run: python3 scripts/ci_checks.py --group skills

  installer:
    name: Installer (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install AI-RULES package
        run: python -m pip install --editable .
      - name: Test installer regressions
        run: python -m unittest discover -s tests/installer
