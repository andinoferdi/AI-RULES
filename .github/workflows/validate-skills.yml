name: Validate skills
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Point skill refs at the commits pinned on main
        run: python3 scripts/skill_refs.py pin
      - name: Install AI-RULES package
        run: python3 -m pip install --editable .
      - name: Run main checks against pinned skills
        run: python3 scripts/ci_checks.py
      - name: Report skill branches waiting for promotion
        if: always()
        run: python3 scripts/skill_refs.py drift >> "$GITHUB_STEP_SUMMARY"

  installer:
    name: Installer (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Point skill refs at the commits pinned on main
        run: python scripts/skill_refs.py pin
      - name: Install AI-RULES package
        run: python -m pip install --editable .
      - name: Test installer regressions
        run: python -m unittest discover -s tests/installer
